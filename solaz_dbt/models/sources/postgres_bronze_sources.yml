version: 2

sources:
  - name: postgres
    description: Raw PostgreSQL data ingested into the Snowflake bronze schema.

    database: SOLAZ_PROD_DB
    schema: BRONZE

    quoting:
      database: false
      schema: false
      identifier: false

    tables:
