name: 'solaz_dbt'
version: '1.0.0'

profile: 'solaz_dbt'

model-paths: ["models"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  solaz_dbt:
    silver:
      +schema: SILVER
      +materialized: table

    gold:
      +schema: GOLD
      
      dimensions:
        +materialized: table

      facts:
        +materialized: incremental

      marts:
        +materialized: incremental